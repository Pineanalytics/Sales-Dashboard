<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pinefrost Server Export Console</title><link rel="stylesheet" href="style.css"></head><body><main><header><img src="pinefrost-icon.png"><div><h1>Server Export Console</h1><p id="scope">Loading local configuration...</p></div><span id="health">Checking...</span></header><section class="card"><h2>Scheduled export health</h2><div id="tasks" class="tasks"></div><p id="files"></p><button id="refresh">Refresh status</button></section><section class="card"><h2>Schedule controls</h2><div class="actions"><select id="branch"><option>NAIROBI</option><option>NYERI</option></select><button data-action="start">Start branch now</button><button data-action="stop" class="danger">Stop branch</button><button data-action="pause" class="danger">Pause all schedules</button><button data-action="resume">Resume all schedules</button></div></section><section class="card"><h2>Selected-date export</h2><p>Creates one archive-aware, serialised UKL export using the existing puller.</p><div class="actions"><input id="date" type="date"><button id="export">Export selected date</button></div></section><section class="card"><h2>Live output</h2><pre id="output">Ready.</pre></section></main><script src="renderer.js"></script></body></html>
