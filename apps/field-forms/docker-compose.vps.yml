# Deploys the field-forms Next.js app onto the same VPS as the existing
# pinefrost stack, joining its Docker network so the shared Caddy instance
# (in /opt/pinefrost) can reverse_proxy to this container by name.
# Talks to Supabase Cloud directly - no local Postgres needed here.

services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    container_name: field-forms-app
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - pinefrost_default
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/login', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  pinefrost_default:
    external: true
