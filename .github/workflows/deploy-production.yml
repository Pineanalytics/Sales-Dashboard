name: Deploy production

on:
  workflow_dispatch:
    inputs:
      push_schema:
        description: Back up Postgres and apply an additive Prisma schema update
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: pinefrost-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run lint
        continue-on-error: true
      - run: npm test
      - run: npm run build

      - name: Configure VPS access
        shell: bash
        env:
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          key=~/.ssh/pinefrost_hostinger
          # The secret is the same key the deploy machine uses. Normalize how it was pasted, never the key itself:
          # Windows line endings (CR) and literal "\n" escapes both make OpenSSH fail with "error in libcrypto".
          printf '%s\n' "$HOSTINGER_SSH_KEY" | sed 's/\\n/\n/g' | tr -d '\r' | sed '/^[[:space:]]*$/d' > "$key"
          chmod 600 "$key"
          # Fail here, with a hint, if the key still cannot be read (it is never printed).
          if ! ssh-keygen -y -f "$key" > /dev/null 2>&1; then
            echo "::error::HOSTINGER_SSH_KEY cannot be read as a private key ($(wc -l < "$key") lines; BEGIN line $(grep -q '^-----BEGIN .*PRIVATE KEY-----$' "$key" && echo found || echo missing); END line $(grep -q '^-----END .*PRIVATE KEY-----$' "$key" && echo found || echo missing)). It must be the full OpenSSH/PEM private key, BEGIN and END lines included, without a passphrase."
            exit 1
          fi
          echo "Key OK: $(ssh-keygen -l -f "$key" | awk '{print $1, $2, $4}')"
          ssh-keyscan -H 187.77.80.216 >> ~/.ssh/known_hosts

      - name: Deploy immutable master build
        shell: pwsh
        run: |
          if ('${{ inputs.push_schema }}' -eq 'true') {
            & ./scripts/deploy.ps1 `
              -SshKey "$HOME/.ssh/pinefrost_hostinger" `
              -SshTarget 'root@187.77.80.216' `
              -PushSchema
          } else {
            & ./scripts/deploy.ps1 `
              -SshKey "$HOME/.ssh/pinefrost_hostinger" `
              -SshTarget 'root@187.77.80.216'
          }
