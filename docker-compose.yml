# Migration plan Step 2's Docker Compose stack: Postgres + the Next.js app +
# Caddy as a reverse proxy handling automatic HTTPS. Real secrets live in a
# root .env file on the VPS (never committed — see .env.example), which
# Docker Compose loads automatically for the variable substitutions below.
#
# Postgres deliberately has no `ports:` mapping — it's reachable only inside
# this compose network, never from the public internet (migration plan's
# security requirement).

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Required only by the host-networked SAP worker. This remains private to
    # the VPS; it is not reachable from the public network.
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    # No limit here previously — confirmed live (docker stats) running
    # unbounded at 4.17GB/120% CPU on a 4-core/15GB host shared with the full
    # Field Forms Supabase stack. Not capping CPU (would throttle real user
    # request latency); memory gets a real ceiling so a genuine runaway/leak
    # OOM-kills and restarts just this container - predictable - instead of
    # the kernel OOM-killer picking a victim among every process on the box,
    # which could just as easily be Postgres. 6g gives ~40% headroom above
    # the observed peak; revisit after the overlayBrandCustomer fix has had
    # a few sync cycles to show its actual new steady-state.
    mem_limit: 6g
    # Field Forms shares this Docker network and also has a service called
    # "app". Give Analytics a stable, non-generic alias for worker-to-API calls.
    networks:
      default:
        aliases:
          - pinefrost-analytics-app
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Single source of truth for the DB password is POSTGRES_PASSWORD above —
      # these are assembled here rather than duplicated as separate secrets in .env.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DIRECT_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # HOSTNAME is deliberately NOT set here — Docker reserves it and silently drops any
      # value passed via `environment:`/`-e` (confirmed: it never even reaches Config.Env).
      # See the Dockerfile's CMD for the actual fix (HOSTNAME must be overridden at the
      # shell layer, inside the container, not from the outside).
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

  # Fast, user-facing call feeds. The dashboard itself never reads Pine/EABL:
  # this worker writes small batches to Postgres in the background.
  live-sync-worker:
    build:
      context: .
      target: sync-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_started
    env_file:
      - .sync.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DIRECT_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # Use the same HTTPS ingress as the established bridge jobs. It handles
      # large JSON request streaming more consistently than the raw internal
      # Next server under concurrent worker writes.
      PL_BRIDGE_APP_URL: https://pinefrostdb.com
      EABL_CALL_APP_URL: https://pinefrostdb.com
      CONTINUOUS_SYNC_JOBS: timestamps,eabl
      TIMESTAMPS_INTERVAL_SECONDS: 30
      TIMESTAMPS_BATCH_SIZE: 250
      EABL_INTERVAL_SECONDS: 60
    cpus: 0.75
    mem_limit: 512m

  # Outlet aggregation can be heavier, so it has a separate cap and can never
  # delay the real-time timestamps worker.
  outlets-sync-worker:
    build:
      context: .
      target: sync-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_started
    env_file:
      - .sync.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DIRECT_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # The worker and API share this private Docker network; keep bridge
      # uploads server-to-server rather than traversing the public proxy.
      PL_BRIDGE_APP_URL: http://pinefrost-analytics-app:3000
      CONTINUOUS_SYNC_JOBS: active-outlets
      # A full YTD aggregate is intentionally a quiet overnight job. It uses
      # bounded weekly source windows and cannot delay live timestamps.
      ACTIVE_OUTLETS_DAILY_AT: "01:15"
      ACTIVE_OUTLETS_RUN_ON_START: "false"
      TZ: Africa/Nairobi
    cpus: 0.75
    mem_limit: 1024m

  # SAP is reachable only through the office-originated reverse tunnel bound
  # to the VPS loopback interface. Host networking allows this container to
  # consume that private listener without publishing SAP to the internet.
  sap-sync-worker:
    build:
      context: .
      target: sync-worker
    restart: unless-stopped
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_started
    env_file:
      - .sync.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@127.0.0.1:5433/${POSTGRES_DB}
      DIRECT_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@127.0.0.1:5433/${POSTGRES_DB}
      PL_BRIDGE_APP_URL: https://pinefrostdb.com
      SQLBRIDGE_SQL_SERVER: 127.0.0.1
      SQLBRIDGE_SQL_PORT: 14333
      CONTINUOUS_SYNC_JOBS: sales,pl,stock
      SALES_INTERVAL_SECONDS: 300
      PL_INTERVAL_SECONDS: 1800
      STOCK_INTERVAL_SECONDS: 900
    cpus: 0.75
    mem_limit: 1024m

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
