function doLogin(){
  document.getElementById("view-login").classList.remove("active");
  document.getElementById("view-app").classList.add("active");
  buildNav();
  goTo("dashboard");
}
function doLogout(){
  document.getElementById("view-app").classList.remove("active");
  document.getElementById("view-login").classList.add("active");
}

function buildNav(){
  document.getElementById("sideNav").innerHTML = NAV.map(n=>`
    <button class="nav-link w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm hover:bg-slate-800" data-key="${n.key}" onclick="goTo('${n.key}')">
      <i data-lucide="${n.icon}" class="w-4 h-4"></i> ${n.label}
    </button>`).join("");
  window.lucide && lucide.createIcons();
}

const RENDERERS = {
  dashboard: renderDashboard, reps: renderReps, routes: renderRoutes, outlets: renderOutlets,
  orders: renderOrders, inventory: renderInventory, distributors: renderDistributors,
  schemes: renderSchemes, reports: renderReports, approvals: renderApprovals, userMgmt: renderUsers
};

function goTo(key){
  document.querySelectorAll(".nav-link").forEach(b=>b.classList.toggle("active", b.dataset.key===key));
  document.getElementById("views").innerHTML = '<div class="fade-in">'+RENDERERS[key]()+'</div>';
  window.lucide && lucide.createIcons();
  if(key==="dashboard") setTimeout(renderDashboardCharts, 20);
  if(key==="reports") setTimeout(renderReportCharts, 20);
}

function pill(status){
  const map = {
    Pending:"bg-amber-100 text-amber-700", Approved:"bg-emerald-100 text-emerald-700", Dispatched:"bg-blue-100 text-blue-700",
    Delivered:"bg-slate-100 text-slate-600", Active:"bg-emerald-100 text-emerald-700", "Credit Hold":"bg-rose-100 text-rose-600",
    New:"bg-blue-100 text-blue-700", Suspended:"bg-rose-100 text-rose-600", Expired:"bg-slate-100 text-slate-500",
    Scheduled:"bg-blue-100 text-blue-700", "Payment Overdue":"bg-rose-100 text-rose-600"
  };
  return `<span class="text-[11px] font-semibold px-2 py-0.5 rounded-full ${map[status]||'bg-slate-100 text-slate-600'}">${status}</span>`;
}
function pageHeader(title, subtitle){
  return `<div class="mb-5"><h1 class="text-xl font-bold text-slate-800">${title}</h1><p class="text-sm text-slate-400 mt-0.5">${subtitle}</p></div>`;
}
function card(inner, extra){ return `<div class="bg-white rounded-xl border border-slate-200 shadow-sm ${extra||''}">${inner}</div>`; }

function renderDashboard(){
  const totalSales = ORDERS.reduce((a,o)=>a+o.total,0);
  const ordersToday = ORDERS.filter(o=>o.date==="9 Sep 2026").length;

    ${pageHeader("Dashboard & Analytics","Company-wide performance snapshot — Tuesday, 9 September 2026")}
    <div class="grid grid-cols-4 gap-4 mb-5">
      ${kpiCard("trending-up","Total Sales (MTD)","KSh "+fmt(totalSales),"+14.2% vs last month","emerald")}
      ${kpiCard("users","Active Sales Reps",REPS.length,"8 of 8 checked in today","teal")}
      ${kpiCard("building-2","Outlets Covered",OUTLETS.length,"3 new this month","blue")}
      ${kpiCard("clipboard-list","Orders Today",ordersToday,"KSh "+fmt(ORDERS.filter(o=>o.date==="9 Sep 2026").reduce((a,o)=>a+o.total,0))+" booked","amber")}
    </div>
    <div class="grid grid-cols-3 gap-4 mb-5">
      ${card(`<div class="p-4"><p class="text-sm font-semibold text-slate-600 mb-3">Sales Trend (Last 8 Weeks)</p><canvas id="dbTrend" height="160"></canvas></div>`,"col-span-2")}
      ${card(`<div class="p-4"><p class="text-sm font-semibold text-slate-600 mb-3">Region-wise Performance</p><canvas id="dbRegion" height="160"></canvas></div>`)}
    </div>
    <div class="grid grid-cols-3 gap-4">
      ${card(`<div class="p-4"><p class="text-sm font-semibold text-slate-600 mb-3">Top Products</p><canvas id="dbTopProducts" height="180"></canvas></div>`)}
      ${card(`<div class="p-4"><p class="text-sm font-semibold text-slate-600 mb-3">Target vs Achievement by Rep</p><canvas id="dbTarget" height="180"></canvas></div>`,"col-span-2")}
    </div>
  `;
}

    ${a.status==="Pending" ? `<div class="flex gap-2 shrink-0">
        <button onclick="setApproval('${a.id}','Approved')" class="text-xs font-semibold bg-emerald-600 text-white px-3 py-2 rounded-lg">Approve</button>
        <button onclick="setApproval('${a.id}','Rejected')" class="text-xs font-semibold bg-white border border-rose-200 text-rose-500 px-3 py-2 rounded-lg">Reject</button>
      </div>` : `<div class="shrink-0">${pill(a.status)}</div>`}
  </div>`;
}
function setApproval(id, status){
  const a = APPROVALS.find(x=>x.id===id);
  a.status = status;
  document.getElementById("approvalList").innerHTML = APPROVALS.map(approvalCard).join("");
  window.lucide && lucide.createIcons();
}

/* ---------------------------------------------------------------
   11. USER & ROLE MANAGEMENT
--------------------------------------------------------------- */
function renderUsers(){
  return `
    ${pageHeader("User & Role Management","Manage back-office and field accounts, roles and permissions")}
    <div class="flex justify-end mb-3"><button onclick="alert('Demo only — this would open an invite-user form.')" class="bg-teal-600 text-white text-xs font-semibold px-4 py-2 rounded-lg flex items-center gap-1.5"><i data-lucide="user-plus" class="w-3.5 h-3.5"></i> Add User</button></div>
    ${card(`<table class="w-full text-sm"><thead><tr class="text-left text-xs text-slate-400 border-b border-slate-100">
      <th class="px-4 py-3 font-medium">Name</th><th class="px-4 py-3 font-medium">Email</th><th class="px-4 py-3 font-medium">Role</th>
      <th class="px-4 py-3 font-medium">Status</th><th class="px-4 py-3 font-medium"></th></tr></thead>
      <tbody>${USERS.map(u=>`<tr class="border-b border-slate-50 hover:bg-slate-50">
        <td class="px-4 py-3 font-medium text-slate-700">${u.name}</td>
        <td class="px-4 py-3 text-slate-500">${u.email}</td>
        <td class="px-4 py-3"><span class="text-[11px] font-semibold px-2 py-0.5 rounded-full bg-slate-100 text-slate-600">${u.role}</span></td>
        <td class="px-4 py-3">${pill(u.status)}</td>
        <td class="px-4 py-3 text-right"><button onclick="alert('Demo only — permissions editor would open here.')" class="text-teal-600 text-xs font-medium">Manage</button></td>
      </tr>`).join("")}</tbody></table>`)}
  `;
}
